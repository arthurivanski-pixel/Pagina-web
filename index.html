<!DOCTYPE html>

<html lang="pt-br">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Blog</title>
            <style>
                header{
                    background-color:#2a2b2c;
                    color:#FFFFFF;
                    text-align: center; 
                    max-width: 800px;   
                    margin: 0 auto; 
                    padding: 16px;
                    border: 5px solid#FFFFFF;             
                }
                main{
                    background-color:#FFFFFF;
                    color:#2a2b2c;
                    max-width: 800px;   
                    margin: 0 auto;
                    display: flex;
                    
                }
                   img{
                    width: 80px;
                    height: 80px;
                   }
                   .artigo-autor{
                    font-weight: bold;
                   }
            </style>
        </head>
    <body>
        <header>
            <h1>Meu blog Corinthiano</h1>
            <p>Vou compartilhar notícias, informações e atualizações sobre o Timão </p>
        </header>
        <main>
            <img src="imagem-blog.jpg" alt="Imagem da fiel torcida, com um mosaico na Neo Química Arena">
                <div> 
                    <h2>Meu primeiro post</h2>
                    <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar notícias, informações e atualizações sobre o Timão, sempre com muita opinião </p>
                    <p class="artigo-autor">Por: Arthur Ivanski</p>
                    <button>🖤 <span>0</span></button>
                    <button>🤍 <span>0</span></button>
                </div>
        </main>
    </body>
    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach( Function(botao){
             botao.addEventListener("click", botaoClicado);
        function botaoClicado(){
            console.log ("fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;
        }
 })
       
    </script>
</html>
